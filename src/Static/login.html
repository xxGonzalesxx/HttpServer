<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SGProducts</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
<div class="logo">
    <img class="logo-img" src="https://i.ibb.co/nq9050H1/logo.png" alt="Logo">
</div>

<div class="nav-top">
    <a href="index.html" class="nav-link">Home</a>
    <a href="projects.html" class="nav-link">Projects</a>
    <a href="info.html" class="nav-link">Info</a>
    <a href="contacts.html" class="nav-link">Contacts</a>
</div>

<div class="container">
    <h1 class="main-title">🔐 Authentication</h1>

    <div class="auth-container">
        <div class="auth-tabs">
            <button class="auth-tab active" data-tab="login">Login</button>
            <button class="auth-tab" data-tab="register">Register</button>
        </div>

        <!-- Login Form -->
        <div id="login-form" class="auth-form active">
            <h2>Welcome Back!</h2>
            <form id="login-form-element">
                <div class="form-group">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" required>
                </div>
                <button type="submit" class="auth-button">Login →</button>
            </form>
            <div class="auth-message" id="login-message"></div>
        </div>

        <!-- Register Form -->
        <div id="register-form" class="auth-form">
            <h2>Create Account</h2>
            <form id="register-form-element">
                <div class="form-group">
                    <label for="register-username">Username</label>
                    <input type="text" id="register-username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="register-password">Password (min 6 chars)</label>
                    <input type="password" id="register-password" name="password" required>
                </div>
                <button type="submit" class="auth-button">Register →</button>
            </form>
            <div class="auth-message" id="register-message"></div>
        </div>
    </div>
</div>

<div class="footer">
    © 2025 SGProducts. Turning ideas into reality.
</div>

<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
